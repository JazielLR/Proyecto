<!DOCTYPE html>
<html lang="es">

<body>

  <header id="encabezado-principal">

      <div class="icono-logo">G</div>

    </div>
  </header>

    <div class="contenedor-autenticacion">
      <h1 class="titulo-formulario">Login</h1>

        <div class="grupo-campo">
          <input type="text" class="campo-texto" placeholder="Correo">

        <div class="grupo-campo">
          <input type="password" class="campo-texto" placeholder="Contraseña">
        </div>
        <button type="submit" class="boton-enviar">Iniciar sesión</button>
      </form>

      <div class="enlaces-autenticacion">
        <a href="recuperar.html">Olvidaste tu contraseña</a>

      </div>
    </div>
